<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>入学説明会のお申し込み開始 | Kira-Kira Juku</title>
    <meta
      name="description"
      content="難関大学の合格実績No.1のKira-Kira Jukuが、現役高校生・高卒生向け入学説明会の申し込みを開始しました。"
    />
    <meta property="og:type" content="article" />
    <meta
      property="og:title"
      content="入学説明会のお申し込み開始 | Kira-Kira Juku"
    />
    <meta
      property="og:description"
      content="難関大学の合格実績No.1のKira-Kira Jukuが、現役高校生・高卒生向け入学説明会の申し込みを開始しました。"
    />
    <meta property="og:url" content="https://example.com/" />
    <meta
      property="og:image"
      content="https://example.com/assets/image/ogimage.png"
    />
    <meta property="og:site_name" content="Kira-Kira Juku" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@400;700;800&ital,wght@0,700;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/style/main.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__container">
        <h1 class="header__logo">
          <a href="/"
            ><img
              src="/assets/image/logo.svg"
              alt="Kira-Kira Juku"
              width="240"
              height="45"
              class="header__logo-image"
          /></a>
        </h1>
        <button
          id="hamburger"
          class="hamburger"
          aria-label="メニューを開く"
          aria-controls="gnav"
          aria-expanded="false"
        >
          <span class="hamburger__line" aria-hidden="true"></span>
        </button>
        <nav id="gnav" class="gnav" aria-label="メインメニュー">
          <ul class="gnav__list">
            <li class="gnav__item">
              <a href="#reason" class="gnav__link">選ばれる3つの理由</a>
            </li>
            <li class="gnav__item">
              <a href="#course" class="gnav__link">コース・目的</a>
            </li>
            <li class="gnav__item">
              <a href="#price" class="gnav__link">費 用</a>
            </li>
          </ul>
          <div class="gnav__button">
            <a href="/entry" class="button button--large"
              >入学説明会に申し込む</a
            >
          </div>
        </nav>
      </div>
    </header>
    <div class="mainvisual">
      <div class="mainvisual__container">
        <div class="mainvisual__box">
          <div class="mainvisual__icon">
            <p class="mainvisual__icon-text">難関大学の合格実績</p>
            <p class="mainvisual__icon-number">No.<span>1</span></p>
          </div>
          <p class="mainvisual__text">現役高校生・高卒生</p>
          <h2 class="mainvisual__title">入学説明会の<br />お申し込み開始</h2>
        </div>
      </div>
    </div>
    <main class="main">
      <section class="main__section">
        <div class="main__container"></div>
      </section>
      <div class="cta">
        <div class="cta__container">
          <p class="cta__text">
            入学ご検討の方は、まずは入学説明会に<br
              class="sp-block"
            />お越しください
          </p>
          <a href="/entry/" class="cta__button button button--main"
            >入学説明会に申し込む</a
          >
        </div>
      </div>
      <section class="section section--other">
        <div class="section--other__container">
          <a href="/faq/" class="card card--left">
            <div class="card__image-wrapper">
              <picture class="card__image">
                <source
                  media="(min-width: 768px)"
                  srcset="/assets/image/pht_qa_pc.jpg"
                  type="image/jpg"
                />
                <source
                  media="(max-width: 767px)"
                  srcset="/assets/image/pht_qa_sp.jpg"
                  type="image/jpg"
                />
                <img
                  src="/assets/image/pht_qa_pc.jpg"
                  alt=""
                  class="picture-img"
                  width="960"
                  height="320"
                />
              </picture>
            </div>
            <p class="card__text">よくあるご質問</p>
          </a>
          <a href="/faq/" class="card card--left">
            <div class="card__image-wrapper">
              <picture class="card__image">
                <source
                  media="(min-width: 768px)"
                  srcset="/assets/image/pht_classrooms_pc.jpg"
                  type="image/jpg"
                />
                <source
                  media="(max-width: 767px)"
                  srcset="/assets/image/pht_classrooms_sp.jpg"
                  type="image/jpg"
                />
                <img
                  src="/assets/image/pht_classrooms_pc.jpg"
                  alt=""
                  class="picture-img"
                  width="960"
                  height="320"
                />
              </picture>
            </div>
            <p class="card__text">お近くの教室を探す</p>
          </a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>
        <small lang="en" class="footer__copyright"
          >copyright&copy; 2023 Kira-Kira Juku All Rights Reserved.</small
        >
      </p>
    </footer>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="/assets/script/main.js"></script>
  </body>
</html>
